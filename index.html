<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vanilla Store - VOS Platform Shield</title>
    <!-- LINK TO YOUR MODULAR STYLESHEETS -->
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/typography.css">
</head>
<body>

    <!-- Liquid organic environment shifting behind the layout window -->
    <div class="ambient-vortex"></div>

    <!-- THE ADAPTIVE NO-CLIP FULL VIEWPORT CHASSIS -->
    <main class="app-chassis">
        
        <!-- THE PHYSICAL LIQUID GLIP SHEEN CONTAINER TRAPPED INSIDE THE LAYOUT CARD -->
        <div class="liquid-wave-shutter"></div>

        <!-- THE HERO BRANDING SECTION -->
        <header class="hero-section">
            <!-- FIXED TARGET PATH MATCHING YOUR EXACT REPOSITORY FILENAME -->
            <img src="./src/assets/vanilla.svg" alt="Vanilla Vector Core" class="brand-vector">
            <h1 class="brand-title">Vanilla Store</h1>
            <p class="system-tagline">Identity Verification Protocol</p>
        </header>

        <!-- IDENTITY STACK: CENTERING OVAL PILL SSO CONTROL TRAY -->
        <section class="auth-stack">
            <button class="pill-btn oauth-google" onclick="triggerHandshake('Google')">Continue with Google</button>
            <button class="pill-btn oauth-apple" onclick="triggerHandshake('Apple')">Continue with Apple</button>
            <button class="pill-btn oauth-microsoft" onclick="triggerHandshake('Microsoft')">Continue with Microsoft</button>
        </section>

        <!-- PERMANENT BASELINE FOOTER LINE -->
        <footer class="app-footer">
            <span class="crypto-stamp">EMF CRYPTO INTEGRITY GATEWAY</span>
            <p class="founder-signature-line">Engineered by Emmanuel Mabheure</p>
        </footer>
    </main>

    <script>
        function triggerHandshake(provider) {
            console.log(`🔑 Redirecting token parameters to secure ${provider} API...`);
            window.location.href = "store.html";
        }
    </script>
</body>
</html>
