<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanilla Store - VOS Platform Shield</title>
    
    <!-- SUBDIRECTORY REPOSITORY LINKS RUNNING NATIVELY -->
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/typography.css">
    
    <!-- MODULAR ASSET HOOKS -->
    <link rel="stylesheet" href="src/assets/background/style.css">
    <link rel="stylesheet" href="src/assets/signin/style.css">
</head>
<body>

    <!-- INJECTS SHIFTING AMBIENT ENVIRONMENT UNDER THE HOOD -->
    <div class="ambient-vortex"></div>

    <!-- THE MASTER APP CHASSIS: FORCED FULL ACCESSIBILITY RULES -->
    <div class="app-chassis">
        
        <!-- VERTICAL TOP-TO-BOTTOM LIQUID GLASS REFLECTION SHEEN -->
        <div class="liquid-wave-shutter"></div>

        <!-- HERO IDENTITY CONTAINER AREA -->
        <div class="hero-section">
            <!-- Brand Vector Asset Positioning Frame -->
            <div class="brand-logo-frame">
                <img src="src/assets/vanilla.svg" alt="Vanilla Vector Core">
            </div>
            
            <!-- Symmetrical Brand Typography Matrix -->
            <h1 class="brand-title-fade">Vanilla Store</h1>
            <p class="system-tagline-fade">Explore original cartoons and 3D games instantly.</p>
        </div>
        
        <!-- LOWER LAYER SLOT: Single Centered Oval Pill Sign In Interactive Button -->
        
            <button class="sso-action-trigger pill-btn oauth-google" onclick="triggerHandshake()">Sign In</button>
        </div>

        <!-- ABSOLUTE FOOTER TRAY: LOCKED PROUDLY AND SECURELY ALONG THE BASELINE -->
        <div class="app-footer">
            <span class="founder-signature-line">Engineered by Emmanuel Mabheure</span>
        </div>

    </div>

    <script>
        function triggerHandshake() {
            console.log("🔑 Initializing secure single-point authentication gateway routing...");
            window.location.href = "store.html";
        }
    </script>
</body>
</html>
