<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanilla Store - VOS Platform Shield</title>
    
    <!-- MASTER DECOUPLED STYLESHEET CHANNELS -->
    <link rel="stylesheet" href="src/styles/layout.css">
    <link rel="stylesheet" href="src/styles/typography.css">
    
    <!-- MODULAR GRAPHIC ASSET SLOTS -->
    <link rel="stylesheet" href="src/assets/background/style.css">
    <link rel="stylesheet" href="src/assets/signin/style.css">
</head>
<body>

    <!-- ASYNCHRONOUS SLOW-MOVING STARS GRAPHIC ENVIRONMENTAL CONTAINER -->
    <div class="stars-animation-container-slot"></div>

    <!-- MAIN APP CHASSIS GRID: FIXED DYNAMIC VIEWPORT HEIGHT MATRIX -->
    <div class="app-chassis">
        
        <!-- TOP-TO-BOTTOM LIQUID GLASS REFLECTION WAVE GLIP LAYER -->
        <div class="liquid-wave-shutter"></div>

        
        <div class="brand-logo-frame">
            <img src="src/assets/vanilla.svg" alt="Vanilla Core">
        </div>
        
        <!-- STRUCTURAL ROW SLOT 2: Symmetrical Center Content Typography Workspace -->
        <div class="text-center-matrix">
            <h1 class="brand-title-fade">Vanilla Store</h1>
            <p class="system-tagline-fade">Explore original cartoons and 3D games instantly.</p>
        </div>
        
        <!-- STRUCTURAL ROW SLOT 3: Single Premium Sign In Active Button Box Alignment Tray -->
        
            <button class="sso-action-trigger" onclick="triggerHandshake()">Sign In</button>
        </div>

        <!-- STRUCTURAL ROW SLOT 4: FIXED BASELINE APP FOOTER SEALS -->
        <div class="app-footer">
            <span class="founder-signature-line">Engineered by Emmanuel Mabheure</span>
        </div>

    </div>

    <script>
        // STRUCTURAL NAVIGATION FLOW HANDSHAKE TRIGGER EVENT
        function triggerHandshake() {
            console.log("🔑 Initializing secure single-point authentication gateway routing...");
            window.location.href = "store.html";
        }
    </script>
</body>
</html>
