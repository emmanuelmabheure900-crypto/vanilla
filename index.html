<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanilla Store - VOS Platform Shield</title>
    <style>
        /* FORCE EVERYTHING EDGE-TO-EDGE AND GRAPHICALLY STABLE */
        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body, html {
            background-color: #050507 !important;
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            color: #ffffff !important;
        }

        /* Ambient Background Blur */
        .ambient-vortex {
            position: absolute !important;
            width: 100% !important;
            height: 100vh !important;
            background: radial-gradient(circle at 50% 50%, rgba(243, 229, 171, 0.12) 0%, rgba(255, 45, 85, 0.03) 50%, transparent 100%) !important;
            filter: blur(60px) !important;
            z-index: 1 !important;
        }

        /* THE CHASSIS TABLE: FORCES ABSOLUTE HORIZONTAL AND VERTICAL CENTERING NATIVELY */
        .master-layout-table {
            width: 100vw !important;
            height: 100vh !important;
            border-collapse: collapse !important;
            position: relative !important;
            z-index: 10 !important;
            text-align: center !important;
        }

        /* Logo Sizing Node */
        .brand-logo-img {
            width: 60px !important;
            height: 60px !important;
            object-fit: contain !important;
            margin: 0 auto !important;
        }

        /* Typography Specification Settings */
        .brand-title {
            font-size: 38px !important;
            font-weight: 800 !important;
            margin-top: 15px !important;
            margin-bottom: 8px !important;
            letter-spacing: -1.5px !important;
            background: linear-gradient(180deg, #ffffff 0%, #b5b5ba 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            display: inline-block !important;
        }

        .system-tagline {
            font-size: 14px !important;
            color: #8e8e93 !important;
            font-weight: 500 !important;
            letter-spacing: -0.1px !important;
        }

        /* OVAL PILL BUTTON CONFIGURATION */
        .button-container-block {
            width: 290px !important;
            margin: 0 auto !important;
        }

        .sso-action-trigger {
            width: 100% !important;
            padding: 16px !important;
            margin-bottom: 12px !important;
            border-radius: 30px !important; /* Perfect oval pill geometry */
            font-size: 14px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            display: block !important;
            box-sizing: border-box !important;
            border: 1px solid rgba(255,255,255,0.04) !important;
            text-align: center !important;
            text-decoration: none !important;
        }

        .oauth-google { background-color: #ffffff !important; color: #1c1c1e !important; }
        .oauth-apple { background-color: #111113 !important; color: #ffffff !important; border-color: rgba(255,255,255,0.1) !important; }
        .oauth-microsoft { background-color: rgba(43, 43, 43, 0.6) !important; color: #ffffff !important; border-color: rgba(255,255,255,0.1) !important; }

        /* FIXED BASELINE FOOTER ARCHITECTURE */
        .crypto-stamp { font-size: 8px !important; color: rgba(255, 255, 255, 0.2) !important; font-weight: 700 !important; letter-spacing: 1.5px !important; text-transform: uppercase; display: block !important; margin-bottom: 4px !important; }
        .founder-signature-line { font-size: 11px !important; color: rgba(255, 255, 255, 0.55) !important; font-weight: 500 !important; display: block !important; }
    </style>
</head>
<body>

    <div class="ambient-vortex"></div>

    <!-- PURE CENTER MATRIX GRAPHICS TABLE -->
    <table class="master-layout-table">
        <!-- TOP SECTION: Logo Vector Space -->
        <tr style="height: 20%;">
            <td style="vertical-align: bottom; padding-bottom: 10px;">
                <img src="src/assets/brand-logo.svg" class="brand-logo-img" alt="🍦">
            </td>
        </tr>

        <!-- CENTER SECTION: Title and Tagline Space -->
        <tr style="height: 30%;">
            <td style="vertical-align: middle;">
                <h1 class="brand-title">Vanilla Store</h1>
                <p class="system-tagline">Identity Verification Protocol</p>
            </td>
        </tr>

        <!-- BASE SECTION: Centered Pill Control Buttons Stack -->
        <tr style="height: 35%;">
            <td style="vertical-align: top; padding-top: 15px;">
                <div class="button-container-block">
                    <div class="sso-action-trigger oauth-google" onclick="triggerHandshake('Google')">Continue with Google</div>
                    <div class="sso-action-trigger oauth-apple" onclick="triggerHandshake('Apple')">Continue with Apple</div>
                    <div class="sso-action-trigger oauth-microsoft" onclick="triggerHandshake('Microsoft')">Continue with Microsoft</div>
                </div>
            </td>
        </tr>

        <!-- FOOTER SECTION: Fixed Baseline Signature Panel -->
        <tr style="height: 15%;">
            <td style="vertical-align: bottom; padding-bottom: 35px;">
                <span class="crypto-stamp">EMF CRYPTO INTEGRITY GATEWAY</span>
                <span class="founder-signature-line">Engineered by Emmanuel Mabheure</span>
            </td>
        </tr>
    </table>

    <script>
        function triggerHandshake(provider) {
            console.log(`🔑 Redirecting token parameters to secure ${provider} API...`);
            window.location.href = "store.html";
        }
    </script>
</body>
</html>
